<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj książkę — Biblioteka</title>
</head>

<body>

    <header>
        <h1>Biblioteka</h1>

        <nav>
            <a href="index.html">Strona główna</a>
            <a href="add_book.html">Dodaj książkę</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Dodaj książkę</h2>

            <form method="post">

                <div>
                    <label for="title">
                        Tytuł:
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        required
                    >
                </div>

                <div>
                    <label for="author">
                        Autor:
                    </label>

                    <input
                        type="text"
                        id="author"
                        name="author"
                        required
                    >
                </div>

                <div>
                    <label for="year">
                        Rok wydania:
                    </label>

                    <input
                        type="number"
                        id="year"
                        name="year"
                        min="0"
                        max="2100"
                    >
                </div>

                <div>
                    <label for="category">
                        Kategoria:
                    </label>

                    <select
                        id="category"
                        name="category"
                    >
                        <option value="">
                            Wybierz kategorię
                        </option>

                        <option value="fantasy">
                            Fantasy
                        </option>

                        <option value="science-fiction">
                            Science fiction
                        </option>

                        <option value="crime">
                            Kryminał
                        </option>

                        <option value="other">
                            Inna
                        </option>
                    </select>
                </div>

                <div>
                    <p>Format:</p>

                    <input
                        type="radio"
                        id="paper"
                        name="format"
                        value="paper"
                        checked
                    >

                    <label for="paper">
                        Papierowa
                    </label>

                    <input
                        type="radio"
                        id="ebook"
                        name="format"
                        value="ebook"
                    >

                    <label for="ebook">
                        E-book
                    </label>
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="available"
                        name="available"
                        checked
                    >

                    <label for="available">
                        Książka dostępna
                    </label>
                </div>

                <div>
                    <label for="description">
                        Opis:
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="6"
                        cols="50"
                    ></textarea>
                </div>

                <div>
                    <button type="submit">
                        Dodaj książkę
                    </button>

                    <button type="reset">
                        Wyczyść formularz
                    </button>
                </div>

            </form>
        </section>

    </main>

    <footer>
        <p>
            Projekt ćwiczeniowy — Projektowanie aplikacji webowych
        </p>
    </footer>

</body>
</html>
